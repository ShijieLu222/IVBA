openapi: 3.0.3
info:
  title: IVBA API
  version: 0.1.0
  description: Independent Venue Booking Platform API (scaffold)
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [System]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/me:
    get:
      operationId: getMe
      summary: Current profile (stub until Auth is wired)
      tags: [Identity]
      responses:
        "200":
          description: Current user profile stub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Profile:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
